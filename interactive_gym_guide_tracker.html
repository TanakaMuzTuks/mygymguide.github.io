    function RestTimerWidget() {
      const [timeLeft, setTimeLeft] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const [initialTime, setInitialTime] = useState(60);

      useEffect(() => {
        let timer = null;
        if (isRunning && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && isRunning) {
          setIsRunning(false);
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.3;
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } catch (e) {
            console.log('Audio Context error', e);
          }
        }
        return () => clearInterval(timer);
      }, [isRunning, timeLeft]);

      const startTimer = (seconds) => {
        setInitialTime(seconds);
        setTimeLeft(seconds);
        setIsRunning(true);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-4 shadow-xl backdrop-blur">
          <div className="flex items-center justify-between mb-3">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
              ⏱️ Rest Timer
            </span>
            {isRunning && (
              <span className="text-xs font-mono font-bold text-emerald-400 animate-pulse">
                RESTING...
              </span>
            )}
          </div>

          <div className="flex items-center justify-between gap-3">
            <div className="text-3xl font-mono font-extrabold text-white bg-slate-950 px-4 py-2 rounded-xl border border-slate-800 min-w-[100px] text-center">
              {formatTime(timeLeft)}
            </div>

            <div className="flex items-center gap-1.5 flex-wrap">
              <button 
                onClick={() => startTimer(60)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${timeLeft === 60 && isRunning ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                60s
              </button>
              <button 
                onClick={() => startTimer(90)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${timeLeft === 90 && isRunning ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                90s
              </button>
              <button 
                onClick={() => startTimer(120)}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${timeLeft === 120 && isRunning ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
              >
                120s
              </button>
              {isRunning ? (
                <button 
                  onClick={() => setIsRunning(false)}
                  className="px-3 py-1.5 rounded-lg text-xs font-bold bg-red-600 text-white hover:bg-red-500"
                >
                  Pause
                </button>
              ) : timeLeft > 0 ? (
                <button 
                  onClick={() => setIsRunning(true)}
                  className="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-600 text-white hover:bg-emerald-500"
                >
                  Resume
                </button>
              ) : null}
            </div>
          </div>
        </div>
      );
    }

                            <span className="text-emerald-400 text-xs">💡</span>
                            <p className="text-xs text-slate-300">
                              <strong className="text-slate-200">Key Cue:</strong> {ex.proTips[0] || ex.setup[0]}
                            </p>
                          </div>

                          {ex.category !== 'Cardio' && (
                            <div className="space-y-2 pt-1">
                              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Set Tracker & Weight Log</span>
                              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                {[0, 1, 2].map((setNum) => {
                                  const isChecked = completedSets[`${selectedDay}_${exId}_set${setNum}`];
                                  const weightVal = workoutLogs[`${selectedDay}_${exId}_set${setNum}_weight`] || '';
                                  const repsVal = workoutLogs[`${selectedDay}_${exId}_set${setNum}_reps`] || '';

                                  return (
                                    <div 
                                      key={setNum} 
                                      className={`p-2.5 rounded-xl border flex items-center justify-between gap-2 transition-all ${
                                        isChecked ? 'bg-emerald-950/30 border-emerald-800/80' : 'bg-slate-950 border-slate-800'
                                      }`}
                                    >
                                      <div className="flex items-center gap-2">
                                        <button
                                          onClick={() => toggleSet(exId, setNum)}
                                          className={`w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs transition-all ${
                                            isChecked ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400 border border-slate-700'
                                          }`}
                                        >
                                          {isChecked ? '✓' : setNum + 1}
                                        </button>
                                        <span className="text-xs text-slate-400 font-medium">Set {setNum + 1}</span>
                                      </div>

                                      <div className="flex items-center gap-1.5 w-28">
                                        <input
                                          type="text"
                                          placeholder="kg"
                                          value={weightVal}
                                          onChange={e => handleLogChange(exId, setNum, 'weight', e.target.value)}
                                          className="w-1/2 bg-slate-900 border border-slate-800 text-xs text-center text-white rounded p-1 focus:outline-none focus:border-emerald-500"
                                        />
                                        <input
                                          type="text"
                                          placeholder="reps"
                                          value={repsVal}
                                          onChange={e => handleLogChange(exId, setNum, 'reps', e.target.value)}
                                          className="w-1/2 bg-slate-900 border border-slate-800 text-xs text-center text-white rounded p-1 focus:outline-none focus:border-emerald-500"
                                        />
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>
              )}
            </div>

            <div className="space-y-6">
              <MuscleAnatomyMap activeMuscles={activeMusclesForDay} />
              <RestTimerWidget />

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-white font-display flex items-center gap-2">
                    <span>🫀 Cardio Protocol</span>
                  </h3>
                  <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-800">
                    Zone 2 Strategy
                  </span>
                </div>

                <div className="space-y-3">
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Rather than taxing your nervous system with 45 minutes of intense sprints post-lifting, do <strong className="text-emerald-400">20–30 minutes of Incline Treadmill Walking</strong>.
                  </p>

                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400">Recommended Incline:</span>
                      <span className="text-amber-400 font-bold">8% – 12%</span>
                    </div>
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400">Pace Speed:</span>
                      <span className="text-amber-400 font-bold">3.2 – 4.0 mph</span>
                    </div>
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400">Duration:</span>
                      <span className="text-amber-400 font-bold">20 – 30 Minutes</span>
                    </div>
                  </div>

                  <div className="bg-blue-950/20 border border-blue-900/40 rounded-xl p-3">
                    <span className="text-xs font-bold text-blue-400 block mb-1">🗣️ The Speech Test Rule</span>
                    <p className="text-[11px] text-slate-300">
                      You should be breathing distinctly harder than resting, but still able to speak a full 10-word sentence without pausing for breath.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <ExerciseModal 
            exercise={selectedExerciseModal} 
            onClose={() => setSelectedExerciseModal(null)} 
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
